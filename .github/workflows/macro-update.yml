# Macro Scorecard — Daily data update
#
# Required GitHub Secrets (Settings → Secrets → Actions → New repository secret):
#   SUPABASE_URL  — your Supabase project URL (e.g. https://xxxx.supabase.co)
#   SUPABASE_KEY  — Supabase SERVICE ROLE key (not the anon key — needs write access)
#   FRED_API_KEY  — free key from https://fred.stlouisfed.org/docs/api/api_key.html
#
# The service role key is in Supabase Dashboard → Settings → API → service_role.

name: Macro Data Update

on:
  schedule:
    - cron: '0 6 * * *'   # 06:00 UTC daily — before European open
  workflow_dispatch:        # allow manual trigger from GitHub Actions UI

jobs:
  update-macro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Run macro update script
        run: node scripts/update-macro.js
        env:
          SUPABASE_URL:  ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:  ${{ secrets.SUPABASE_KEY }}
          FRED_API_KEY:  ${{ secrets.FRED_API_KEY }}
